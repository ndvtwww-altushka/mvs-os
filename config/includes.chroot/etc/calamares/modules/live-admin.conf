---
# MVS OS — донастройка установленной системы.
#
# Это единственный шаг, который отличает установленную систему от Live:
# снимаются демо-правила, включается защита, убираются live-пакеты.
# Всё пишется в /var/log/mvs-install.log внутри установленной системы.

dontChroot: false
timeout: 900
script:
    - "sh"
    - "-c"
    - |
      set -u
      LOG=/var/log/mvs-install.log
      log() { printf '%s\n' "$*" >> "$LOG"; }

      log "== MVS OS: донастройка установленной системы =="

      # 1. Убрать правила Live-режима: здесь действует пароль пользователя.
      rm -f /etc/sudoers.d/90-mvs-live
      rm -f /etc/polkit-1/rules.d/49-mvs-live.rules
      rm -f /etc/lightdm/lightdm.conf.d/50-mvs-autologin.conf
      log "правила Live-режима удалены"

      # 2. Имя системы без пометки «Live». Версия — из одного файла.
      #    Маркер /etc/mvs-live удаляется: дальше mvs-identity переводит
      #    os-release под dpkg-divert и пишет MVS при каждом обновлении.
      rm -f /etc/mvs-live
      chmod 755 /usr/local/sbin/mvs-identity /usr/local/sbin/mvs-snapshot 2>/dev/null || true
      chmod 755 /etc/grub.d/40_mvs_snapshots 2>/dev/null || true
      if [ -x /usr/local/sbin/mvs-identity ]; then
          if /usr/local/sbin/mvs-identity >> "$LOG" 2>&1; then
              log "идентичность MVS записана"
          else
              log "ВНИМАНИЕ: mvs-identity завершился с ошибкой"
          fi
      fi
      printf 'mvs-os\n' > /etc/hostname
      log "имя системы обновлено"

      # 2b. Снимки btrfs. Субтом @snapshots создаёт Calamares (mount.conf);
      #     если его нет в fstab — добавляем строку, чтобы снимки были
      #     видны в /mvs-snapshots и переживали перезагрузку.
      install -d -m 755 /mvs-snapshots
      if grep -q 'subvol=/@' /etc/fstab 2>/dev/null \
              && ! grep -q ' /mvs-snapshots ' /etc/fstab; then
          ROOT_UUID=$(awk '$2 == "/" { print $1; exit }' /etc/fstab | sed -n 's/^UUID=//p')
          if [ -n "$ROOT_UUID" ]; then
              printf 'UUID=%s /mvs-snapshots btrfs defaults,noatime,subvol=/@snapshots,nofail 0 0\n' \
                  "$ROOT_UUID" >> /etc/fstab
              log "снимки btrfs: /mvs-snapshots добавлен в fstab"
          else
              log "ВНИМАНИЕ: не удалось определить UUID корня для /mvs-snapshots"
          fi
      fi
      systemctl enable mvs-identity.service >> "$LOG" 2>&1 \
          || log "не удалось включить mvs-identity.service"
      log "снимки btrfs: подготовка завершена"

      # 3. Межсетевой экран: входящие запрещены, исходящие разрешены.
      if [ -f /etc/ufw/ufw.conf ]; then
          sed -i 's/^ENABLED=.*/ENABLED=yes/' /etc/ufw/ufw.conf
      fi
      if [ -f /etc/default/ufw ]; then
          sed -i 's/^DEFAULT_INPUT_POLICY=.*/DEFAULT_INPUT_POLICY="DROP"/' /etc/default/ufw
          sed -i 's/^DEFAULT_OUTPUT_POLICY=.*/DEFAULT_OUTPUT_POLICY="ACCEPT"/' /etc/default/ufw
      fi
      log "ufw: включён, входящие по умолчанию запрещены"

      # 4. Службы установленной системы.
      systemctl enable lightdm.service NetworkManager.service >> "$LOG" 2>&1 || log "не удалось включить lightdm/NetworkManager"
      systemctl enable ufw.service >> "$LOG" 2>&1 || log "не удалось включить ufw.service"
      systemctl enable apparmor.service >> "$LOG" 2>&1 || log "не удалось включить apparmor.service"

      # 5. Убрать live-пакеты: иначе система помнит, что она «с флешки».
      if command -v apt-get >/dev/null 2>&1; then
          if DEBIAN_FRONTEND=noninteractive apt-get remove --purge -y \
                  live-boot live-config live-config-systemd live-tools >> "$LOG" 2>&1; then
              log "live-пакеты удалены"
          else
              log "ВНИМАНИЕ: live-пакеты удалить не удалось (см. журнал apt выше)"
          fi
      fi

      # 5b. Пересобрать initramfs. Скрипты live-boot попали в него при
      #     сборке образа; без пересборки они остались бы в загрузчике
      #     установленной системы, хотя пакет уже удалён.
      if command -v update-initramfs >/dev/null 2>&1; then
          if update-initramfs -u -k all >> "$LOG" 2>&1; then
              log "initramfs пересобран без live-boot"
          else
              log "ВНИМАНИЕ: update-initramfs завершился с ошибкой (см. журнал)"
          fi
      fi

      # 5c. Ярлыки установщика нужны только на флешке. В установленной
      #     системе это была бы кнопка, которая всегда отказывает.
      rm -f /usr/share/applications/mvs-install.desktop
      rm -f /etc/skel/Desktop/mvs-install.desktop
      for desktop in /home/*/Desktop; do
          [ -d "$desktop" ] && rm -f "$desktop/mvs-install.desktop"
      done
      if command -v update-desktop-database >/dev/null 2>&1; then
          update-desktop-database /usr/share/applications >> "$LOG" 2>&1 || true
      fi
      log "ярлыки установщика убраны"

      # 6. Без рабочего sudo администратора нет — это критично.
      if ! visudo -c >> "$LOG" 2>&1; then
          log "КРИТИЧНО: visudo сообщает об ошибке в sudoers"
          exit 1
      fi
      log "sudoers проверен"

      log "== донастройка завершена =="
      exit 0
