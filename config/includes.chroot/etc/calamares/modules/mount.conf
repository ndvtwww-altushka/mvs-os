---
# Куда монтируется будущая система и как разложить btrfs.
#
# Установка по умолчанию — btrfs с субтомами:
#   @            корень системы;
#   @home        домашние папки (снимок системы их не затрагивает);
#   @snapshots   снимки, отдельный субтом рядом с @.
#
# Снимки лежат вне @, поэтому не попадают внутрь следующих снимков.
# Перед каждым обновлением MVS Update делает снимок @, а GRUB получает
# пункт «откат» на этот снимок (см. /etc/grub.d/40_mvs_snapshots).
#
# Если пользователь выберет ext4 или xfs, установка просто пройдёт без
# снимков: MVS Update честно сообщит, что откат недоступен.

rootMountPoint: "/target"

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /mvs-snapshots
      subvolume: /@snapshots
