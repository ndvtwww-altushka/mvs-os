---
# Источник файлов системы — squashfs с загрузочной флешки.
#
# live-boot монтирует образ в /run/live/medium и оставляет совместимый
# путь /lib/live/mount/medium. Используем второй: он работает в обеих
# схемах монтирования Debian 12.
unpack:
    -   source: "/lib/live/mount/medium/live/filesystem.squashfs"
        sourcefs: "squashfs"
        destination: ""
