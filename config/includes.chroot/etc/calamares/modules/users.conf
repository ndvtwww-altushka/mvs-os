---
# Учётная запись пользователя установленной системы.
#
# Пароль обязателен (allowWeakPasswords: false), root-пароль не задаётся:
# административные действия идут через sudo от основной учётки.
# Именно это отличает установленную систему от Live-демо.
defaultGroups:
    - users
    - lp
    - video
    - audio
    - plugdev
    - sudo
    - games
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
allowWeakPasswords: false
userShell: /bin/bash
