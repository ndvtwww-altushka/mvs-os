---
# Разметка диска.
#
# erase (стереть диск) — выбор пользователя, ничего не делается автоматически.
# Перед записью Calamares показывает «Сводку» с диском и разделами; без
# нажатия «Установить» на диск ничего не пишется.

efiSystemPartition: "/boot/efi"
userSwapChoices:
    - small
    - suspend
    - file
    - none
drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
initialSwapChoice: small
defaultFileSystemType: "ext4"
availableFileSystemTypes:
    - ext4
    - btrfs
    - xfs
requiredStorage: 10
