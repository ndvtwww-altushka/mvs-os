---
# MVS OS — последовательность установки Calamares.
#
# Оставлены только те модули, для которых в проекте есть готовые конфиги
# (/etc/calamares/modules/*.conf). Так установщик не падает на «неизвестном
# модуле» и не требует пакетов, которых нет в списке.
#
# Смысл шагов:
#   show — страницы, которые видит пользователь;
#   exec — то, что реально меняет диск (после подтверждения в «Сводке»).

modules-search: [ local ]

instances:
    # Отдельный экземпляр shellprocess: донастройка установленной системы
    # (снять правила Live, включить firewall/AppArmor, убрать live-пакеты).
    # В sequence он вызывается как shellprocess@live-admin, а конфиг —
    # modules/live-admin.conf (иначе Calamares искал бы shellprocess.conf).
    - id: live-admin
      module: shellprocess
      config: live-admin.conf

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - users
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        - users
        - networkcfg
        - hwclock
        - shellprocess@live-admin
        - bootloader
        - umount
    - show:
        - finished

branding: mvs

# Ставить без лишнего вопроса «вы уверены?» — подтверждение уже есть
# в разделе «Сводка», где перечислены диск и создаваемые разделы.
prompt-install: false

# Работаем через chroot в /target: так модули видят установленную систему.
dont-chroot: false
oem-setup: false

# Отменять установку можно до начала записи, но не во время неё.
disable-cancel: false
disable-cancel-during-exec: true
