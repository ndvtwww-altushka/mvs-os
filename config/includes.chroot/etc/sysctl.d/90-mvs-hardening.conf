# MVS OS — параметры ядра.
#
# Не «магические тюнинги», а понятные защиты и разумные сетевые значения.
# Всё обратимо: файл можно удалить, ядро вернётся к значениям по умолчанию.

# --- защита от утечек и эксплуатации -------------------------------------
# Скрыть адреса ядра от обычных пользователей.
kernel.kptr_restrict = 2
# Читать dmesg может только root: меньше информации для атакующего.
kernel.dmesg_restrict = 1
# Отключить ptrace для чужих процессов: мешает краже паролей из памяти.
kernel.yama.ptrace_scope = 1
# Не создавать core dump для setuid-программ.
fs.suid_dumpable = 0
# Защита от подмены ссылок в /tmp.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
# ASLR включён (значение по умолчанию, фиксируем явно).
kernel.randomize_va_space = 2

# --- сеть ----------------------------------------------------------------
# Не быть маршрутизатором по умолчанию.
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0
# Отбрасывать пакеты с «невозможных» адресов.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
# Защита от SYN-флуда.
net.ipv4.tcp_syncookies = 1
# Не логировать martian-пакеты: на ноутбуке это только шум.
net.ipv4.conf.all.log_martians = 0

# --- отзывчивость при нехватке памяти ------------------------------------
# swappiness для zram задаёт mvs-live-tuning (100): сжатому swap нужно
# отдавать холодные страницы охотно. Здесь остаётся только давление
# кэша: 50 — компромисс между памятью и лишними обращениями к диску.
vm.vfs_cache_pressure = 50
