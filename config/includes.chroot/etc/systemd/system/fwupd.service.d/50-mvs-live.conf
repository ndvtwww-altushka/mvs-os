[Unit]
# MVS OS: в Live-сеансе служба не нужна. Фоновые проверки обновлений,
# прошивок и сети зря занимают процессор — особенно в QEMU без KVM,
# где каждый такт считается программно. В установленной системе
# (маркера /etc/mvs-live нет) служба работает как обычно.
ConditionPathExists=!/etc/mvs-live
