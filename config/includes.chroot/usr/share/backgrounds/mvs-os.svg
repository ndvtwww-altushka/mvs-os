<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0a0b12"/>
      <stop offset="0.55" stop-color="#12131d"/>
      <stop offset="1" stop-color="#1b1d2b"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.14" cy="0.08" r="0.62">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#7aa2f7" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.92" r="0.55">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dcfff"/>
      <stop offset="0.55" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#7aa2f7" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>
  <rect width="1920" height="1080" fill="url(#glowA)"/>
  <rect width="1920" height="1080" fill="url(#glowB)"/>

  <!-- Большой знак справа: глубина без пестроты. -->
  <g transform="translate(1230 330)" opacity="0.06" fill="none" stroke="#c0caf5"
     stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 380V40l150 150L300 40v340"/>
  </g>

  <g transform="translate(120 300)">
    <rect x="0" y="0" width="128" height="128" rx="30" fill="#161722"
          stroke="url(#mark)" stroke-width="2.5"/>
    <path d="M32 94V34l32 32 32-32v60" fill="none" stroke="url(#mark)" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="120" y="520" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="78"
        font-weight="700" fill="#dbe3ff" letter-spacing="-1">MVS OS</text>
  <text x="120" y="574" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="27"
        fill="url(#mark)" font-weight="600">Aurora Nova</text>
  <rect x="120" y="606" width="420" height="3" rx="1.5" fill="url(#rule)"/>

  <text x="120" y="950" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="20"
        fill="#565f89">своя система</text>
  <text x="1800" y="1010" text-anchor="end" font-family="Noto Sans, DejaVu Sans, sans-serif"
        font-size="19" fill="#414868" letter-spacing="2">MVS OS · 2026</text>
</svg>
