<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>MVS OS — Aurora</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0c14"/>
      <stop offset="0.55" stop-color="#161826"/>
      <stop offset="1" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="ribbon1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#7aa2f7" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#bb9af7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ece6a" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#9ece6a" stop-opacity="0.28"/>
      <stop offset="0.75" stop-color="#7dcfff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7dcfff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <ellipse cx="960" cy="520" rx="900" ry="520" fill="url(#glow)"/>

  <g filter="url(#soft)" fill="none" stroke-linecap="round">
    <path d="M-80 360C280 210 520 470 900 330S1420 120 2000 300" stroke="url(#ribbon1)" stroke-width="120"/>
    <path d="M-80 560C320 430 640 640 1020 520S1560 360 2000 500" stroke="url(#ribbon2)" stroke-width="90"/>
    <path d="M-80 760C360 690 700 820 1080 720S1640 620 2000 720" stroke="url(#ribbon1)" stroke-width="70" opacity="0.55"/>
  </g>

  <g fill="#c0caf5" opacity="0.5">
    <circle cx="240" cy="180" r="1.6"/>
    <circle cx="520" cy="120" r="1.2"/>
    <circle cx="860" cy="200" r="1.8"/>
    <circle cx="1180" cy="140" r="1.3"/>
    <circle cx="1520" cy="230" r="1.7"/>
    <circle cx="1760" cy="120" r="1.2"/>
    <circle cx="1000" cy="120" r="1.1"/>
  </g>

  <g text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif">
    <text x="960" y="1000" font-size="26" fill="#c0caf5" opacity="0.85" letter-spacing="14">MVS OS</text>
    <text x="960" y="1032" font-size="14" fill="#7aa2f7" opacity="0.75" letter-spacing="6">AURORA</text>
  </g>
</svg>
