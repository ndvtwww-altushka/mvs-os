<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>MVS OS — Grid</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11121a"/>
      <stop offset="0.6" stop-color="#16161e"/>
      <stop offset="1" stop-color="#1f2335"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#2a2f45" stroke-width="1"/>
    </pattern>
    <radialGradient id="spot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7aa2f7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.65"/>
  <ellipse cx="960" cy="470" rx="820" ry="420" fill="url(#spot)"/>

  <rect x="360" y="470" width="1200" height="2" fill="url(#line)"/>
  <rect x="560" y="520" width="800" height="1" fill="#3b4261" opacity="0.7"/>
  <rect x="760" y="560" width="400" height="1" fill="#3b4261" opacity="0.45"/>

  <g text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif">
    <text x="960" y="440" font-size="92" fill="#e6e9f5" letter-spacing="18">MVS OS</text>
    <text x="960" y="490" font-size="20" fill="#7aa2f7" letter-spacing="10">AURORA 1.0</text>
    <text x="960" y="1032" font-size="14" fill="#565f89" letter-spacing="3">DEBIAN 12 · XFCE · MVS</text>
  </g>
</svg>
